<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Master Brain"/>
<title>Master Brain</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#ffffff;--bg2:#f7f7f5;--bg3:#efeeeb;--border:#e3e2de;--border2:#d3d1cb;--text:#1a1916;--text2:#4a4845;--text3:#9b9893;--text4:#c5c3be;--accent:#e16259;--accent-bg:#fdf2f1;--brown:#937264;--brown-bg:#f5ede8;--green:#448361;--green-bg:#eef3ee;--blue:#2f80d0;--blue-bg:#eef4fb;--yellow:#cb912f;--yellow-bg:#fdf6e3;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--r:6px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;font-size:15px}
#app{height:100%;display:flex;flex-direction:column;padding-top:var(--safe-top)}
.screen{display:none;flex-direction:column;height:100%;overflow:hidden}
.screen.active{display:flex}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 12px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg)}
.topbar-left{display:flex;align-items:center;gap:10px}
.ws-icon{width:28px;height:28px;background:var(--text);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ws-name{font-weight:600;font-size:14px;color:var(--text)}
.topbar-date{font-size:12px;color:var(--text3)}
.page-hdr{padding:22px 20px 12px;flex-shrink:0}
.page-emoji{font-size:32px;line-height:1;margin-bottom:8px;display:block}
.page-title{font-family:'Lora',serif;font-weight:600;font-size:26px;letter-spacing:-0.5px;line-height:1.2}
.page-sub{font-size:13px;color:var(--text3);margin-top:3px;font-weight:300}
.divider{height:1px;background:var(--border);margin:0 20px;flex-shrink:0}
.sec-label{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:0.8px;text-transform:uppercase;padding:14px 20px 8px;flex-shrink:0}
.cap-row{display:flex;gap:8px;padding:0 20px 12px;flex-shrink:0}
.cap-btn{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;transition:background .15s}
.cap-btn:active{background:var(--bg3)}
.cap-btn.recording{background:#fdf2f1;border-color:#f5b8b4}
.cap-btn.recording .cap-lbl{color:var(--accent)}
.cap-btn.recording .cap-ico{animation:mpulse 1s ease-in-out infinite}
@keyframes mpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.cap-ico{font-size:22px;line-height:1}
.cap-lbl{font-size:11px;font-weight:500;color:var(--text2)}
.brief-trigger{margin:0 20px 10px;background:var(--text);border:none;border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;flex-shrink:0}
.brief-trigger:active{opacity:.85}
.bt-icon{font-size:18px}.bt-text{flex:1}
.bt-label{font-weight:600;font-size:14px;color:#fff}
.bt-sub{font-size:11px;color:rgba(255,255,255,.45);margin-top:2px}
.bt-arr{color:rgba(255,255,255,.3);font-size:18px}
.feed{flex:1;overflow-y:auto;padding:4px 20px calc(var(--safe-bottom) + 80px)}
.feed::-webkit-scrollbar{display:none}
.feed-empty{padding:40px 0;text-align:center}
.feed-empty-txt{font-size:13px;color:var(--text4);line-height:1.7;font-weight:300;max-width:200px;margin:0 auto}
.block{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);animation:fIn .25s ease}
.block:last-child{border-bottom:none}
@keyframes fIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.blk-bull{width:20px;flex-shrink:0;padding-top:2px;text-align:center;font-size:14px}
.blk-body{flex:1;min-width:0}
.blk-content{font-size:14px;color:var(--text);line-height:1.6;word-break:break-word}
.blk-content img{width:100%;border-radius:4px;margin-top:6px}
.blk-meta{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
.blk-tag{font-size:10px;font-weight:500;padding:2px 8px;border-radius:3px}
.tv{background:var(--accent-bg);color:var(--accent)}.tph{background:var(--blue-bg);color:var(--blue)}
.tdump{background:#f1f0ed;color:var(--text3)}.ttask{background:var(--green-bg);color:var(--green)}
.tidea{background:var(--yellow-bg);color:var(--yellow)}.tproject{background:var(--brown-bg);color:var(--brown)}
.tdate{background:var(--blue-bg);color:var(--blue)}.blk-time{font-size:11px;color:var(--text4)}
.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:8px 0 calc(var(--safe-bottom) + 6px);z-index:50}
.ntab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;cursor:pointer}
.ntab-ico{font-size:20px;line-height:1}.ntab-lbl{font-size:10px;color:var(--text3);font-weight:500}
.ntab.active .ntab-lbl{color:var(--text);font-weight:600}
#type-screen{background:var(--bg)}
.type-top{display:flex;align-items:center;gap:10px;padding:14px 18px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.ico-btn{width:32px;height:32px;border-radius:var(--r);background:var(--bg2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.type-ttl{font-family:'Lora',serif;font-weight:600;font-size:17px;flex:1}
.save-btn{background:var(--text);color:#fff;border:none;border-radius:var(--r);padding:8px 18px;font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:13px;cursor:pointer}
.save-btn:active{opacity:.8}
.type-props{display:flex;gap:6px;padding:10px 18px;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
.type-props::-webkit-scrollbar{display:none}
.pchip{flex-shrink:0;display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg2);font-size:12px;color:var(--text2);cursor:pointer;transition:all .1s}
.pchip.active{background:var(--text);border-color:var(--text);color:#fff}
.pdot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.6}
#type-area{flex:1;border:none;outline:none;resize:none;font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:300;line-height:1.8;color:var(--text);padding:18px 20px calc(var(--safe-bottom) + 20px);background:transparent;caret-color:var(--accent)}
#type-area::placeholder{color:var(--text4)}
#brief-screen{background:var(--bg)}
.brief-scroll{flex:1;overflow-y:auto;padding-bottom:calc(var(--safe-bottom) + 80px)}
.brief-scroll::-webkit-scrollbar{display:none}
.brief-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 24px;gap:16px}
.spinner{width:28px;height:28px;border:2px solid var(--border2);border-top-color:var(--text);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-lbl{font-size:13px;color:var(--text3)}
.bpage{padding:0 20px 20px}.bpage-hdr{padding:22px 0 16px}
.bpage-emoji{font-size:30px;display:block;line-height:1;margin-bottom:8px}
.bpage-title{font-family:'Lora',serif;font-weight:600;font-size:24px;letter-spacing:-0.5px}
.b-greeting{padding:0 0 16px;font-family:'Lora',serif;font-size:16px;font-style:italic;color:var(--text2);line-height:1.65;border-bottom:1px solid var(--border);margin-bottom:20px}
.b-block{margin-bottom:22px;animation:fIn .3s ease both}
.b-block:nth-child(2){animation-delay:.05s}.b-block:nth-child(3){animation-delay:.1s}.b-block:nth-child(4){animation-delay:.15s}.b-block:nth-child(5){animation-delay:.2s}
.b-block-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.b-block-ttl{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;white-space:nowrap}
.b-block-line{flex:1;height:1px;background:var(--border)}
.plist{display:flex;flex-direction:column;gap:1px}
.prow{display:flex;gap:12px;align-items:flex-start;padding:14px;background:var(--bg2)}
.prow:first-child{border-radius:var(--r) var(--r) 0 0}.prow:last-child{border-radius:0 0 var(--r) var(--r)}.prow:only-child{border-radius:var(--r)}
.prow.needle{background:var(--text)}
.prank{font-family:'Lora',serif;font-weight:600;font-size:20px;color:var(--text4);line-height:1;flex-shrink:0;width:20px;padding-top:1px}
.prow.needle .prank{color:rgba(255,255,255,.25)}.pbody{flex:1}
.nlabel{display:inline-block;font-size:10px;font-weight:600;color:rgba(255,255,255,.55);letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px}
.ptitle{font-weight:500;font-size:14px;color:var(--text);margin-bottom:4px;line-height:1.4}
.prow.needle .ptitle{color:#fff}.pwhy{font-size:13px;color:var(--text3);line-height:1.55;font-weight:300}
.prow.needle .pwhy{color:rgba(255,255,255,.5)}
.b-txt{background:var(--bg2);border-radius:var(--r);border-left:3px solid var(--border2);padding:13px 15px;font-size:14px;color:var(--text2);line-height:1.7;font-weight:300}
.b-txt.callout{border-left-color:var(--text);background:var(--bg3);color:var(--text);font-style:italic;font-family:'Lora',serif;font-size:15px;font-weight:400}
.cal-strip{background:var(--bg2);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.cal-item{display:flex;gap:10px;align-items:flex-start}
.cal-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:5px}
.cal-body{flex:1}.cal-title{font-size:13px;font-weight:500;color:var(--text);line-height:1.4}
.cal-time{font-size:11px;color:var(--text3);margin-top:2px}
#toast{position:fixed;bottom:calc(var(--safe-bottom) + 88px);left:50%;transform:translateX(-50%) translateY(10px);background:var(--text);border-radius:20px;padding:9px 18px;font-size:12px;color:#fff;font-weight:500;opacity:0;transition:all .25s ease;pointer-events:none;white-space:nowrap;z-index:200}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#photo-input{display:none}
</style>
</head>
<body>
<div id="app">
<div id="home-screen" class="screen active">
  <div class="topbar">
    <div class="topbar-left">
      <div class="ws-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
      <div class="ws-name">Master Brain</div>
    </div>
    <div class="topbar-date" id="topbar-date"></div>
  </div>
  <div class="page-hdr">
    <span class="page-emoji">🧠</span>
    <div class="page-title">Today's Workspace</div>
    <div class="page-sub">Capture everything. Filter nothing.</div>
  </div>
  <div class="divider"></div>
  <div class="sec-label">Quick Capture</div>
  <div class="cap-row">
    <button class="cap-btn" id="voice-btn" onclick="toggleRecording()"><div class="cap-ico" id="voice-ico">🎙</div><div class="cap-lbl" id="voice-lbl">Voice</div></button>
    <button class="cap-btn" onclick="document.getElementById('photo-input').click()"><div class="cap-ico">📷</div><div class="cap-lbl">Photo</div></button>
    <button class="cap-btn" onclick="showScreen('type-screen')"><div class="cap-ico">✏️</div><div class="cap-lbl">Type</div></button>
  </div>
  <button class="brief-trigger" onclick="showBrief()">
    <div class="bt-icon">⚡</div>
    <div class="bt-text"><div class="bt-label">Generate Daily Brief</div><div class="bt-sub">AI reads your notes → tells you what to do first</div></div>
    <div class="bt-arr">›</div>
  </button>
  <div class="sec-label">Today's Notes</div>
  <div class="feed" id="feed"><div class="feed-empty" id="feed-empty"><div class="feed-empty-txt">Nothing yet.<br/>Tap Voice, Photo, or Type<br/>to start dumping it in.</div></div></div>
</div>
<div id="type-screen" class="screen">
  <div class="type-top">
    <div class="ico-btn" onclick="goHome()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4a4845" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></div>
    <div class="type-ttl">New Note</div>
    <button class="save-btn" onclick="saveText()">Save</button>
  </div>
  <div class="type-props">
    <div class="pchip active" data-tag="dump" onclick="selTag(this)"><span class="pdot"></span> Brain Dump</div>
    <div class="pchip" data-tag="task" onclick="selTag(this)"><span class="pdot"></span> Task</div>
    <div class="pchip" data-tag="idea" onclick="selTag(this)"><span class="pdot"></span> Idea</div>
    <div class="pchip" data-tag="project" onclick="selTag(this)"><span class="pdot"></span> Project</div>
    <div class="pchip" data-tag="date" onclick="selTag(this)"><span class="pdot"></span> Date / Event</div>
  </div>
  <textarea id="type-area" placeholder="What's on your mind? Brain dump it all. Don't filter…"></textarea>
</div>
<div id="brief-screen" class="screen">
  <div class="topbar">
    <div class="topbar-left">
      <div class="ico-btn" onclick="goHome()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4a4845" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></div>
      <div class="ws-name">Daily Brief</div>
    </div>
    <div class="topbar-date" id="brief-date"></div>
  </div>
  <div class="brief-scroll">
    <div class="brief-loading" id="brief-loading"><div class="spinner"></div><div class="spin-lbl">Reading your notes…</div></div>
    <div class="bpage" id="bpage" style="display:none;"></div>
  </div>
</div>
</div>
<div class="bnav" id="bnav">
  <div class="ntab active" id="nt-cap" onclick="navTo('home-screen','nt-cap')"><div class="ntab-ico">📥</div><div class="ntab-lbl">Capture</div></div>
  <div class="ntab" id="nt-brief" onclick="navTo('brief-screen','nt-brief');generateBrief()"><div class="ntab-ico">⚡</div><div class="ntab-lbl">Brief</div></div>
</div>
<div id="toast"></div>
<input type="file" id="photo-input" accept="image/*" onchange="handlePhoto(event)"/>
<script>
let captures=JSON.parse(localStorage.getItem('mb4')||'[]');
let isRecording=false,mediaRecorder=null,audioChunks=[],currentTag='dump';
let briefDone=false,lastBriefKey='';
function init(){const d=new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});document.getElementById('topbar-date').textContent=d;document.getElementById('brief-date').textContent=d;renderFeed();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.getElementById('bnav').style.display=id==='type-screen'?'none':'flex';if(id==='type-screen')setTimeout(()=>document.getElementById('type-area').focus(),100);}
function navTo(sid,tid){showScreen(sid);document.querySelectorAll('.ntab').forEach(t=>t.classList.remove('active'));document.getElementById(tid).classList.add('active');}
function goHome(){navTo('home-screen','nt-cap');}
function showBrief(){navTo('brief-screen','nt-brief');generateBrief();}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200);}
function selTag(el){document.querySelectorAll('.pchip').forEach(c=>c.classList.remove('active'));el.classList.add('active');currentTag=el.dataset.tag;}
function addCapture(type,content,img){const entry={id:Date.now(),type,content,img:img||null,tag:currentTag,time:new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})};captures.unshift(entry);localStorage.setItem('mb4',JSON.stringify(captures));briefDone=false;renderFeed();}
const BULLS={voice:'🎙',photo:'📷',text:'·'};
const TCLS={voice:'tv',photo:'tph',dump:'tdump',task:'ttask',idea:'tidea',project:'tproject',date:'tdate'};
function renderFeed(){const feed=document.getElementById('feed');const empty=document.getElementById('feed-empty');feed.querySelectorAll('.block').forEach(b=>b.remove());if(!captures.length){empty.style.display='block';return;}empty.style.display='none';captures.forEach(c=>{const el=document.createElement('div');el.className='block';const bull=BULLS[c.type]||'·';const tk=c.type==='voice'?'voice':c.type==='photo'?'photo':(c.tag||'dump');const tc=TCLS[tk]||'tdump';const lbl=tk.charAt(0).toUpperCase()+tk.slice(1);const body=(c.type==='photo'&&c.img)?`<div class="blk-content"><img src="${c.img}" alt=""/></div>`:`<div class="blk-content">${esc(c.content)}</div>`;el.innerHTML=`<div class="blk-bull">${bull}</div><div class="blk-body">${body}<div class="blk-meta"><span class="blk-tag ${tc}">${lbl}</span><span class="blk-time">${c.time}</span></div></div>`;feed.appendChild(el);});}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}
async function toggleRecording(){if(!isRecording){try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(stream);audioChunks=[];mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);mediaRecorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());finishVoice();};mediaRecorder.start();isRecording=true;document.getElementById('voice-btn').classList.add('recording');document.getElementById('voice-ico').textContent='⏹';document.getElementById('voice-lbl').textContent='Stop';}catch(e){toast('Mic access needed');}}else{mediaRecorder.stop();isRecording=false;document.getElementById('voice-btn').classList.remove('recording');document.getElementById('voice-ico').textContent='🎙';document.getElementById('voice-lbl').textContent='Voice';toast('Saving…');}}
function finishVoice(){const t=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});addCapture('voice',`Voice note recorded at ${t}`,null);toast('Voice note saved ✓');}
function handlePhoto(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=async ev=>{const dataUrl=ev.target.result;const b64=dataUrl.split(',')[1];toast('Reading image…');try{const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:300,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:file.type,data:b64}},{type:'text',text:'Describe this screenshot or photo in 1-2 plain sentences. What does it show? Any visible text? Be factual and concise.'}]}]})});const d=await res.json();const desc=d.content?.find(b=>b.type==='text')?.text||'Image captured.';addCapture('photo',desc,dataUrl);}catch{addCapture('photo','Image captured.',dataUrl);}toast('Photo saved ✓');};reader.readAsDataURL(file);e.target.value='';}
function saveText(){const ta=document.getElementById('type-area');const txt=ta.value.trim();if(!txt)return;addCapture('text',txt,null);ta.value='';goHome();toast('Note saved ✓');}
async function generateBrief(){const key=JSON.stringify(captures.map(c=>c.id));if(briefDone&&lastBriefKey===key)return;document.getElementById('brief-loading').style.display='flex';document.getElementById('bpage').style.display='none';if(!captures.length){renderBriefEmpty();return;}const notes=captures.map(c=>`[${c.type.toUpperCase()}${c.tag&&c.tag!=='dump'?' / '+c.tag.toUpperCase():''} — ${c.time}]: ${c.content}`).join('\n\n');const today=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});let calendarContext='No calendar data available.';if(window.__calendarEvents){calendarContext=window.__calendarEvents.map(e=>`- ${e.title} at ${e.time}`).join('\n');}try{const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1400,system:`You are Alex Acuff's personal Chief of Staff and productivity AI. Alex runs the Acuff Weekley Group at eXp Realty in Auburn, Alabama — top real estate team, 200+ homes/year. High-output operator, Andy Frisella mindset, hates fluff. Team: Mary Gail (partner), Hope (marketing), Laurel (TC), 13 agents. Read notes and calendar, produce sharp daily brief. Respond ONLY with valid JSON: {"greeting":"Punchy personal line","calendar":[{"title":"Event","time":"Time"}],"priorities":[{"rank":1,"title":"Task","why":"Why needle mover","needle":true},{"rank":2,"title":"Task","why":"Why matters","needle":false},{"rank":3,"title":"Task","why":"Why on list","needle":false}],"dates":"Dates or null","ideas":"Ideas or null","callout":"One honest observation"}`,messages:[{role:'user',content:`Today is ${today}.\n\nCALENDAR:\n${calendarContext}\n\nNOTES:\n${notes}\n\nGive me my brief.`}]})});const data=await res.json();const raw=data.content?.find(b=>b.type==='text')?.text||'{}';const brief=JSON.parse(raw.replace(/```json|```/g,'').trim());renderBrief(brief);briefDone=true;lastBriefKey=key;}catch(err){renderBriefError();}}
function renderBrief(b){document.getElementById('brief-loading').style.display='none';const pg=document.getElementById('bpage');pg.style.display='block';let h=`<div class="bpage-hdr"><span class="bpage-emoji">⚡</span><div class="bpage-title">Daily Brief</div></div>`;if(b.greeting)h+=`<div class="b-greeting">${esc(b.greeting)}</div>`;if(b.calendar?.length){h+=`<div class="b-block"><div class="b-block-hdr"><div class="b-block-ttl">On Your Calendar</div><div class="b-block-line"></div></div><div class="cal-strip">`;b.calendar.forEach(ev=>{h+=`<div class="cal-item"><div class="cal-dot"></div><div class="cal-body"><div class="cal-title">${esc(ev.title)}</div><div class="cal-time">${esc(ev.time)}</div></div></div>`;});h+=`</div></div>`;}if(b.priorities?.length){h+=`<div class="b-block"><div class="b-block-hdr"><div class="b-block-ttl">Top 3 Today</div><div class="b-block-line"></div></div><div class="plist">`;b.priorities.forEach(p=>{h+=`<div class="prow ${p.needle?'needle':''}"><div class="prank">${p.rank}</div><div class="pbody">${p.needle?'<div class="nlabel">▲ Move The Needle</div>':''}<div class="ptitle">${esc(p.title)}</div><div class="pwhy">${esc(p.why)}</div></div></div>`;});h+=`</div></div>`;}if(b.dates&&b.dates!=='null'&&b.dates!==null)h+=`<div class="b-block"><div class="b-block-hdr"><div class="b-block-ttl">Dates & Deadlines</div><div class="b-block-line"></div></div><div class="b-txt">📅 ${esc(b.dates)}</div></div>`;if(b.ideas&&b.ideas!=='null'&&b.ideas!==null)h+=`<div class="b-block"><div class="b-block-hdr"><div class="b-block-ttl">Ideas to Park</div><div class="b-block-line"></div></div><div class="b-txt">💡 ${esc(b.ideas)}</div></div>`;if(b.callout)h+=`<div class="b-block"><div class="b-block-hdr"><div class="b-block-ttl">Straight Talk</div><div class="b-block-line"></div></div><div class="b-txt callout">${esc(b.callout)}</div></div>`;pg.innerHTML=h;}
function renderBriefEmpty(){document.getElementById('brief-loading').style.display='none';const pg=document.getElementById('bpage');pg.style.display='block';pg.innerHTML=`<div style="padding:60px 0;text-align:center;"><div style="font-size:32px;margin-bottom:12px;">📭</div><div style="font-size:14px;color:var(--text3);line-height:1.7;font-weight:300;">Nothing captured yet.<br/>Go dump something in first.</div></div>`;}
function renderBriefError(){document.getElementById('brief-loading').style.display='none';const pg=document.getElementById('bpage');pg.style.display='block';pg.innerHTML=`<div class="b-txt" style="margin-top:20px;">Something went wrong. Check your connection and try again.</div>`;}
init();
</script>
